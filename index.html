<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão Saudável</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="loginContainer">

    <!-- LADO ESQUERDO -->

    <div class="loginEsquerda">

        <div class="logoArea">

            <div class="logo">

                <i class="fa-solid fa-users-viewfinder"></i>

            </div>

            <h1>

                Gestão Saudável

            </h1>

            <p>

                Plataforma de Monitoramento da Conformidade Psicossocial

            </p>

        </div>

        <div class="descricao">

            <div class="descricaoItem">

                <i class="fa-solid fa-chart-line"></i>

                <span>

                    Monitoramento organizacional

                </span>

            </div>

            <div class="descricaoItem">

                <i class="fa-solid fa-heart"></i>

                <span>

                    Saúde psicossocial

                </span>

            </div>

            <div class="descricaoItem">

                <i class="fa-solid fa-building"></i>

                <span>

                    Indicadores estratégicos

                </span>

            </div>

            <div class="descricaoItem">

                <i class="fa-solid fa-user-shield"></i>

                <span>

                    Conformidade com a NR-1

                </span>

            </div>

        </div>

    </div>

    <!-- LADO DIREITO -->

    <div class="loginDireita">

        <div class="loginCard">

            <h2>

                Entrar

            </h2>

            <p>

                Utilize as credenciais da sua empresa.

            </p>

            <div class="campo">

                <label>

                    Empresa

                </label>

                <input
                    type="text"
                    id="empresa"
                    placeholder="Digite o nome da empresa">

            </div>

            <div class="campo">

                <label>

                    Usuário

                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário">

            </div>

            <div class="campo">

                <label>

                    Senha

                </label>

                <div class="senhaBox">

                    <input
                        type="password"
                        id="senha"
                        placeholder="********">

                    <button
                        id="mostrarSenha"
                        type="button">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <button
                id="btnLogin"
                class="botaoPrincipal">

                Entrar

            </button>

            <div class="linhaSeparadora">

                <span>

                    ou

                </span>

            </div>

            <button
                id="btnCadastro"
                class="botaoSecundario">

                Cadastrar Empresa

            </button>

            </div>

        </div>

    </div>

</div>

<script src="js/banco.js"></script>
<script src="js/login.js"></script>

</body>

</html>
